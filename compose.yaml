services:
  aws-emulator:
    build:
      context: ./.aws-emulator
      pull: true
      no_cache: true
    ports:
      - "127.0.0.1:9297:9297"
    environment:
      EMULATOR_TELEMETRY: "off"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./.aws-emulator/9297:/home/emulator/.aws/emulator/9297
    networks:
      - aws-emulator
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - --cacert
        - /home/emulator/.aws/emulator/9297/ca.pem
        - https://127.0.0.1:9297/__admin/health
      interval: 2s
      timeout: 5s
      retries: 30

  aws-emulator-init:
    image: public.ecr.aws/aws-cli/aws-cli:latest
    depends_on:
      aws-emulator:
        condition: service_healthy
    network_mode: service:aws-emulator
    environment:
      AWS_ENDPOINT_URL: https://127.0.0.1:9297
      AWS_SHARED_CREDENTIALS_FILE: /home/emulator/.aws/emulator/9297/emulator_credentials
      AWS_CONFIG_FILE: /home/emulator/.aws/emulator/9297/config
      AWS_CA_BUNDLE: /home/emulator/.aws/emulator/9297/ca.pem
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_PAGER: ""
    volumes:
      - ./.aws-emulator/9297:/home/emulator/.aws/emulator/9297:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test "$$(aws sts get-caller-identity --query Account --output text)" = 000000000000
        aws s3api head-bucket --bucket orders-test 2>/dev/null || aws s3api create-bucket --bucket orders-test

networks:
  aws-emulator:
